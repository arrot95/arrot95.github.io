<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Tableau d'allocation clair</title>
    <style>
        body {
            background-color: #ffffff; /* fond clair */
            font-family: Arial, sans-serif;
            padding: 40px;
            color: #222;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #fafafa;
            border: 1px solid #ddd;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: center;
        }

        th {
            background-color: #f0f0f0;
            font-weight: bold;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        .positive {
            color: #008000;
            font-weight: bold;
        }

        .negative {
            color: #cc0000;
            font-weight: bold;
        }

        input[type="range"] {
            width: 120px;
        }
    </style>
</head>

<body>
    <h1>Tableau d'allocation</h1>

    <table>
        <tr>
            <th>Fonds</th>
            <th>7 jours</th>
            <th>1 mois</th>
            <th>3 mois</th>
            <th>YTD</th>
            <th>Allocation</th>
        </tr>

        <tr>
            <td>iShares MSCI Global Semiconductors</td>
            <td class="negative">-7,0%</td>
            <td class="negative">-22,0%</td>
            <td class="positive">+13,6%</td>
            <td class="positive">+65,9%</td>
            <td><input type="range" min="0" max="100" value="10"></td>
        </tr>

        <tr>
            <td>Amundi Euro Stoxx Banks</td>
            <td class="positive">+2,4%</td>
            <td class="positive">+5,6%</td>
            <td class="positive">+21,0%</td>
            <td class="positive">+19,4%</td>
            <td><input type="range" min="0" max="100" value="15"></td>
        </tr>

        <tr>
            <td>Amundi MSCI EM Asia</td>
            <td class="negative">-0,7%</td>
            <td class="negative">-8,4%</td>
            <td class="positive">+4,1%</td>
            <td class="positive">+19,2%</td>
            <td><input type="range" min="0" max="100" value="10"></td>
        </tr>

        <tr>
            <td>Amundi PEA Nasdaq-100</td>
            <td class="negative">-2,0%</td>
            <td class="negative">-7,6%</td>
            <td class="positive">+4,9%</td>
            <td class="positive">+13,6%</td>
            <td><input type="range" min="0" max="100" value="10"></td>
        </tr>
    </table>
</body>
</html>
