<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Allocation interactive</title>
    <style>
        body {
            background-color: #ffffff;
            font-family: Arial, sans-serif;
            padding: 20px;
            color: #222;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }
        input[type="range"] {
            width: 120px;
        }
        .positive { color: green; font-weight: bold; }
        .negative { color: red; font-weight: bold; }
    </style>
</head>
<body>

<h1>Simulateur d'allocation</h1>

<table id="allocationTable">
    <thead>
        <tr>
            <th>Nom</th>
            <th>Perf YTD</th>
            <th>Allocation (%)</th>
            <th>Perf pondérée</th>
        </tr>
    </thead>
    <tbody>

        <tr data-perf="65.9">
            <td>Semiconductors</td>
            <td class="positive">+65,9%</td>
            <td>
                <input type="range" min="0" max="100" value="10" oninput="updateAllocation(this)">
                <span class="allocValue">10</span>%
            </td>
            <td class="perfPonderee"></td>
        </tr>

        <tr data-perf="19.4">
            <td>Euro Stoxx Banks</td>
